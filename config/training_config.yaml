# Training Configuration for UTAE Water Segmentation

model:
  name: "UTAE_Water_Segmentation"
  s1_channels: 2  # VV, VH
  s2_channels: 6  # Selected S2 bands
  encoder_widths: [64, 128, 256, 512]
  out_conv: [32, 32]
  n_classes: 2
  temporal_length: 1
  temporal_attention: false
  spatial_attention: true
  n_head: 8

data:
  dataset_name: "ibm-granite/granite-geospatial-uki-flooddetection"
  batch_size: 8
  num_workers: 4
  target_size: [256, 256]
  load_to_memory: false  # Set to true for faster training if you have enough RAM
  
  # Data augmentation settings
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate_90: 0.5

training:
  epochs: 100
  learning_rate: 1e-4
  weight_decay: 1e-4
  
loss:
  type: "focal"  # cross_entropy, weighted_ce, dice, focal, or combo
  alpha: 0.25
  gamma: 2.0
  ignore_index: -1
  class_weights: [1.0, 3.0]  # [no_water, water]

paths:
  data_dir: "data/processed"
  checkpoint_dir: "experiments/checkpoints"
